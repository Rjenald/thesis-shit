name: final_thesis_ui
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  record: ^6.0.0
  permission_handler: ^12.0.1
  just_audio: ^0.10.5
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.1
  share_plus: ^10.0.0
  video_player: ^2.9.2
  provider: ^6.0.0
  youtube_player_flutter: ^9.1.3
  audio_session: ^0.1.25
  image_picker: ^1.1.2
  # ffmpeg_kit_flutter_new_min instead of the "full" variant — whisper_ggml
  # already depends on the min build transitively for its own audio
  # conversion, and both packages register identical Android classes under
  # the same package, which conflicts at build time if both are present.
  # The min build still has the core audio filters (amix/atempo/aresample)
  # our mixed-recording feature uses.
  ffmpeg_kit_flutter_new_min: ^2.1.0
  tflite_flutter: ^0.12.1
  whisper_ggml: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#050505"
  image: assets/logo.png
  android_12:
    color: "#050505"
    image: assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/videos/lifetime_benben.mp4
    - assets/audio/
    - assets/models/